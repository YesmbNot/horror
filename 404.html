<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>SIGNAL LOST</title>
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&display=swap">
<style>
:root{--bg:#000;--fg:#e8e8ee;--dim:#8a8fa6;--red:#ff4a4a;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"VT323","Courier New",monospace;display:grid;place-items:center;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;opacity:.35}
.box{position:relative;text-align:center;padding:24px 16px;max-width:680px}
h1{font-size:clamp(44px,11vw,88px);font-weight:400;margin:0;line-height:1;letter-spacing:.04em}
p{font-size:clamp(22px,5vw,30px);margin:14px 0 0}
.red{color:var(--red)}
.dim{color:var(--dim);font-size:22px}
a{color:var(--fg)}
@media (prefers-reduced-motion:reduce){canvas{display:none}}
</style>
<script type="module" src="/analytics.js"></script>
</head>
<body>
<canvas id="snow" width="160" height="120"></canvas>
<div class="box">
  <h1>SIGNAL LOST</h1>
  <p id="msg" class="red">THIS PAGE WAS LET IN.</p>
  <p class="dim" id="path"></p>
  <p class="dim"><a href="/">RETURN TO CHANNEL 9</a></p>
</div>
<script>
(function(){
  var p=decodeURIComponent(location.pathname.toLowerCase());
  var EGGS=[
    ["pepper","PEPPER WAS LET IN."],["june","JUNE IS ASLEEP. JUNE IS ASLEEP."],["dale","DALE IS AT THE STATION. THE STATION IS VERY QUIET."],
    ["gene","GENE IS STILL IN THE TRANSMITTER ROOM."],["ortiz","GENE IS STILL IN THE TRANSMITTER ROOM."],["ruth","PLEASE DO NOT CALL RUTH AT HOME."],
    ["hal","VISIBILITY: ZERO."],["weather","VISIBILITY: ZERO. WIND FROM THE WEST, AT WALKING SPEED."],["linden","EVERYONE ON LINDEN STREET IS ASLEEP."],
    ["palmer","THE PALMERS MOVED TO OHIO IN AUGUST. THE LIGHT IS STILL ON."],["linda","LINDA IS HOME. LINDA IS HOME."],["pete","PETE COUNTED."],
    ["333","TAPE 333 IS STILL RECORDING."],["knock","DO NOT COUNT THEM."],["door","DO NOT ANSWER THE DOOR."],["window","DO NOT WAVE BACK."],
    ["guest","YOU LET IT IN WHEN YOU TYPED THAT."],["buttons","MR. BUTTONS' PLAYHOUSE IS PRE-EMPTED UNTIL FURTHER NOTICE."],["ext9","EXTENSION 9 IS RINGING."],
    ["help","WKVN DOES NOT CALL VIEWERS."]
  ];
  for(var i=0;i<EGGS.length;i++){ if(p.indexOf(EGGS[i][0])>=0){ document.getElementById("msg").textContent=EGGS[i][1]; break; } }
  document.getElementById("path").textContent="NO CARRIER ON "+location.pathname.toUpperCase();
  var c=document.getElementById("snow"),x=c.getContext("2d",{willReadFrequently:true}),img=x.createImageData(c.width,c.height);
  function f(){ for(var i=0;i<img.data.length;i+=4){ var v=Math.random()*255; img.data[i]=img.data[i+1]=img.data[i+2]=v; img.data[i+3]=255; } x.putImageData(img,0,0); requestAnimationFrame(f); }
  if(!(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches)) f();
  try{ console.log("%cyou are looking in the wrong room. try the one the crawlers can't enter.","color:#ff4a4a;font:14px monospace"); }catch(e){}
})();
</script>
</body>
</html>
